appId: dev.tesixki.nai-llm-generator
productName: NAI LLM Generator
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: resources
asar: true
# The stdio Danbooru server is spawned with ELECTRON_RUN_AS_NODE by the CLI providers,
# so it (and its shared chunks) must exist as real files outside the asar archive.
asarUnpack:
  - out/main/danbooru-mcp-stdio.js
  - out/main/chunks/**
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
linux:
  target: AppImage
